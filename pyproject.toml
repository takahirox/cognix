[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognix"
version = "0.1.0"
description = "A bounded local Ollama coding agent"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[project.scripts]
cognix = "cognix.cli:main"

[tool.setuptools]
packages = ["cognix"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]
