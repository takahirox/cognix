[package]
name = "cognix"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A bounded local Ollama coding agent"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
regex = "1"
percent-encoding = "2"

[[example]]
name = "evaluate_ollama"
path = "examples/evaluate_ollama.rs"
